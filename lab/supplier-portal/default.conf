# MOCK-WEB-002 — a SECOND synthetic lab target, so the platform can be shown
# managing more than one application.
#
# It is a few static pages served by nginx, deliberately configured the way a
# hastily-deployed internal portal often is: no security headers, a cookie with
# no attributes, a version banner, a login form posted over cleartext, and a
# URL-valued parameter. Nothing here is exploitable; there is no application
# behind it. The point is that the platform's PASSIVE rule packs have something
# real and distinct to observe.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Deliberately left on: a version banner is one of the things the
    # information-disclosure rule pack looks for.
    server_tokens on;
    add_header X-Powered-By "Express/4.17.1" always;

    location / {
        # nginx does NOT inherit add_header into a block that sets its own, so
        # the version banner is repeated here rather than silently dropped.
        add_header X-Powered-By "Express/4.17.1" always;
        # A session cookie with no HttpOnly, no SameSite, no Secure.
        add_header Set-Cookie "portal_session=SYNTHETIC-LAB-VALUE; Path=/" always;
        try_files $uri $uri/ /index.html;
    }
}
