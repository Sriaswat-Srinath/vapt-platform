# VAPT application stack — M1.5 TOPOLOGY VERIFICATION.
#
# postgres and redis are REAL, digest-pinned services (MVP phase 1). frontend,
# api and worker are still PLACEHOLDERS (lab/placeholders/listen.py): they hold a
# container open on an explicit address so topology stays measurable until the
# application exists. No endpoints, no migrations, no authentication, no scanner
# adapter yet. Replacing a placeholder must preserve every NET-* property —
# `make net-verify` is re-run as acceptance (M2-N1, M2-N6).
#
# Topology (docs/NETWORK_ARCHITECTURE.md, ADR-0012):
#   vapt_edge    internal  frontend + api        (the api's HTTP listener binds HERE ONLY)
#   vapt_core    internal  api + worker + postgres + redis
#   vapt_egress  internal  api + egress-proxy
#   vapt_wan     bridge    egress-proxy + llm-standin   <- the ONLY WAN route
#
# The api therefore has no internet route at all; the proxy is the sole egress
# boundary and accepts CONNECT to one allowlisted destination.
name: vapt

networks:
  vapt_edge:
    name: ${EDGE_NETWORK_NAME:-vapt_edge}
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: "${EDGE_SUBNET:-172.30.20.0/24}"
  vapt_core:
    name: ${CORE_NETWORK_NAME:-vapt_core}
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: "${CORE_SUBNET:-172.30.21.0/24}"
  vapt_egress:
    name: ${EGRESS_NETWORK_NAME:-vapt_egress}
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: "${EGRESS_SUBNET:-172.30.22.0/24}"
  vapt_wan:
    name: ${WAN_NETWORK_NAME:-vapt_wan}
    driver: bridge
    ipam:
      config:
        - subnet: "${WAN_SUBNET:-172.30.23.0/24}"

x-placeholder: &placeholder
  image: python@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
  restart: "no"
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  user: "65532:65532"
  pids_limit: 128
  mem_limit: 256m
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  command: ["python3", "/app/listen.py"]
  volumes:
    - ./lab/placeholders/listen.py:/app/listen.py:ro

services:
  frontend:
    <<: *placeholder
    container_name: vapt_frontend
    hostname: frontend
    environment:
      SERVICE_NAME: frontend
      BIND_SPEC: "172.30.20.10:8080"
    networks:
      vapt_edge:
        ipv4_address: 172.30.20.10

  # TODO(MVP phase 2): replace with the real FastAPI service, same networks,
  # same edge-only HTTP bind. NET-G5/NET-J8 must stay green.
  api:
    <<: *placeholder
    container_name: vapt_api
    hostname: api
    # The HTTP listener binds the vapt_edge address ONLY, so nothing on
    # vapt_core (the worker) or vapt_egress (the proxy) can reach it.
    environment:
      SERVICE_NAME: api
      BIND_SPEC: "172.30.20.20:8000"
      HTTPS_PROXY: "http://172.30.22.60:3128"
      HTTP_PROXY: "http://172.30.22.60:3128"
      LLM_ENABLED: "false"
      LLM_PROVIDER_HOST: "llm-standin"
      LLM_PROVIDER_PORT: "8443"
    networks:
      vapt_edge:
        ipv4_address: 172.30.20.20
      vapt_core:
        ipv4_address: 172.30.21.20
      vapt_egress:
        ipv4_address: 172.30.22.20

  worker:
    <<: *placeholder
    container_name: vapt_worker
    hostname: worker
    # NO proxy variables, NO LLM variables, NO credentials. Airgapped by
    # topology: vapt_core only in M1.5 (vapt_lab is added in M3).
    environment:
      SERVICE_NAME: worker
      BIND_SPEC: "172.30.21.30:9000"
    networks:
      vapt_core:
        ipv4_address: 172.30.21.30

  postgres:
    # REAL service (MVP phase 1) — digest-pinned. vapt_core only: no egress path.
    image: postgres@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    container_name: vapt_postgres
    hostname: postgres
    restart: "no"
    init: true
    user: "70:70"                      # postgres uid/gid in the alpine image
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vapt}
      POSTGRES_USER: ${POSTGRES_USER:-vapt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - listen_addresses=172.30.21.40   # core interface only, never 0.0.0.0
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    volumes:
      - vapt_pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,nosuid,size=64m
      - /run/postgresql:rw,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 172.30.21.40 -U ${POSTGRES_USER:-vapt} -d ${POSTGRES_DB:-vapt}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      vapt_core:
        ipv4_address: 172.30.21.40

  redis:
    # REAL service (MVP phase 1) — digest-pinned. vapt_core only: no egress path.
    image: redis@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
    container_name: vapt_redis
    hostname: redis
    restart: "no"
    init: true
    user: "999:1000"                   # redis uid/gid in the alpine image
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    command:
      - redis-server
      - --bind
      - 172.30.21.50                   # core interface only, never 0.0.0.0
      - --port
      - "6379"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    tmpfs:
      - /data:rw,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 172.30.21.50 -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    networks:
      vapt_core:
        ipv4_address: 172.30.21.50

  egress-proxy:
    <<: *placeholder
    container_name: vapt_egress_proxy
    hostname: egress-proxy
    command: ["python3", "/app/proxy.py"]
    volumes:
      - ./lab/egress-proxy/proxy.py:/app/proxy.py:ro
    environment:
      SERVICE_NAME: egress-proxy
      PROXY_BIND_IP: "172.30.22.60"          # egress interface only, never 0.0.0.0
      PROXY_PORT: "3128"
      EGRESS_ALLOWLIST: "${EGRESS_ALLOWLIST:-llm-standin:8443}"
      # Defence in depth: only the api's egress address may use the proxy. The
      # worker and frontend already cannot reach this port (NET-G3 / NET-I3);
      # the proxy refuses them regardless of network state.
      ALLOWED_CLIENT_CIDRS: "${ALLOWED_CLIENT_CIDRS:-172.30.22.20/32}"
      PROXY_MAX_CONCURRENT_TUNNELS: "${PROXY_MAX_CONCURRENT_TUNNELS:-16}"
      PROXY_MAX_TUNNEL_SECONDS: "${PROXY_MAX_TUNNEL_SECONDS:-900}"
      PROXY_MAX_TUNNEL_BYTES: "${PROXY_MAX_TUNNEL_BYTES:-67108864}"
      INTERNAL_DENY_CIDRS: "172.30.20.0/24,172.30.21.0/24,172.30.22.0/24,172.30.10.0/24"
    networks:
      vapt_egress:
        ipv4_address: 172.30.22.60
      vapt_wan:
        ipv4_address: 172.30.23.60

  llm-standin:
    <<: *placeholder
    container_name: vapt_llm_standin
    hostname: llm-standin
    # TEST ONLY. Stands in for the provider endpoint so no real provider is ever
    # contacted. Removed with the rest of the M1.5 stack (make net-down).
    command: ["python3", "/app/standin.py"]
    volumes:
      - ./lab/llm-standin/standin.py:/app/standin.py:ro
    environment:
      SERVICE_NAME: llm-standin
      STANDIN_PORT: "8443"
    networks:
      vapt_wan:
        ipv4_address: 172.30.23.70

volumes:
  vapt_pgdata:
    name: vapt_pgdata
