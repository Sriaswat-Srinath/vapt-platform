# VAPT application stack — M1.5 TOPOLOGY VERIFICATION.
#
# postgres, redis, the api and the worker are REAL services (MVP phases 1-3).
# Only the frontend is still a PLACEHOLDER (lab/placeholders/listen.py): they hold a
# container open on an explicit address so topology stays measurable until the
# application exists. No endpoints, no migrations, no authentication, no scanner
# adapter yet. Replacing a placeholder must preserve every NET-* property —
# `make net-verify` is re-run as acceptance (M2-N1, M2-N6).
#
# Topology (docs/NETWORK_ARCHITECTURE.md, ADR-0012):
#   vapt_edge    internal  frontend + api        (the api's HTTP listener binds HERE ONLY)
#   vapt_core    internal  api + worker + postgres + redis
#   vapt_egress  internal  api + egress-proxy
#   vapt_wan     bridge    egress-proxy + llm-standin   <- the ONLY WAN route
#
# The api therefore has no internet route at all; the proxy is the sole egress
# boundary and accepts CONNECT to one allowlisted destination.
name: vapt

networks:
  vapt_lab:
    # EXTERNAL: the lab is its own compose project (vapt-lab) and owns this
    # network. The worker joins it; the api never does.
    name: ${LAB_NETWORK_NAME:-vapt_lab}
    external: true
  vapt_edge:
    name: ${EDGE_NETWORK_NAME:-vapt_edge}
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: "${EDGE_SUBNET:-172.30.20.0/24}"
  vapt_core:
    name: ${CORE_NETWORK_NAME:-vapt_core}
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: "${CORE_SUBNET:-172.30.21.0/24}"
  vapt_egress:
    name: ${EGRESS_NETWORK_NAME:-vapt_egress}
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: "${EGRESS_SUBNET:-172.30.22.0/24}"
  vapt_wan:
    name: ${WAN_NETWORK_NAME:-vapt_wan}
    driver: bridge
    ipam:
      config:
        - subnet: "${WAN_SUBNET:-172.30.23.0/24}"

x-placeholder: &placeholder
  image: python@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
  restart: "no"
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  user: "65532:65532"
  pids_limit: 128
  mem_limit: 256m
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  command: ["python3", "/app/listen.py"]
  volumes:
    - ./lab/placeholders/listen.py:/app/listen.py:ro

services:
  frontend:
    # REAL analyst dashboard (MVP phase 7). A static bundle served by nginx:
    # there is no node runtime in the served image, no credential in its
    # environment and no network but vapt_edge. nginx proxies /api to the api's
    # edge address, so the browser talks to exactly one origin and the api's
    # edge-only binding is preserved. NET-I* must stay green.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vapt-frontend:dev
    container_name: vapt_frontend
    hostname: frontend
    restart: "no"
    init: true
    read_only: true
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 192m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      # uid/gid are required: a tmpfs is root-owned by default and nginx runs
      # unprivileged here.
      - /var/cache/nginx:rw,nosuid,size=16m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=4m,uid=101,gid=101
    environment:
      SERVICE_NAME: frontend
      # Documents the posture and grants nothing (NET-C).
      LLM_ENABLED: "false"
    networks:
      vapt_edge:
        ipv4_address: 172.30.20.10

  api:
    # REAL FastAPI service (MVP phase 2). Internal networks only: no internet
    # route. Its HTTP listener binds the vapt_edge address ONLY, so neither the
    # worker (vapt_core) nor the egress proxy (vapt_egress) can reach it —
    # NET-G5 / NET-J8 must stay green.
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vapt-api:dev
    container_name: vapt_api
    hostname: api
    restart: "no"
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      # Unredacted evidence originals. NEVER mounted into a scanner container
      # (ADR-0011); asserted by the lab check.
      - vapt_evidence:/var/lib/vapt/evidence
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      EVIDENCE_BLOB_ROOT: /var/lib/vapt/evidence
      # WeasyPrint's font stack wants a writable cache; the root filesystem is
      # read-only, so point it at the tmpfs.
      XDG_CACHE_HOME: /tmp
      REDACTION_HMAC_KEY: ${REDACTION_HMAC_KEY:?REDACTION_HMAC_KEY must be set}
      REDACTION_KEY_ID: ${REDACTION_KEY_ID:-v1}
      API_BIND_IP: 172.30.20.20
      API_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vapt}:${POSTGRES_PASSWORD:?}@172.30.21.40:5432/${POSTGRES_DB:-vapt}
      REDIS_URL: redis://172.30.21.50:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      # Standing safety posture — all false. Enabling any of these is a
      # deliberate, separately authorised act.
      SCANNER_EXECUTION_ENABLED: ${SCANNER_EXECUTION_ENABLED:-false}
      ZAP_ADAPTER_ENABLED: ${ZAP_ADAPTER_ENABLED:-false}
      ACTIVE_SCAN_ENABLED: ${ACTIVE_SCAN_ENABLED:-false}
      DUAL_CONTROL_AVAILABLE: ${DUAL_CONTROL_AVAILABLE:-false}
      DEFAULT_SCANNER_ADAPTER: ${DEFAULT_SCANNER_ADAPTER:-mock}
      LAB_SUBNET: ${LAB_SUBNET:-172.30.10.0/24}
      # The advisory agent (L3). OFF by default; `make test-agent` turns it on
      # for one run against the LOCAL stand-in and turns it back off. Enabling
      # it grants no execution capability: the agent proposes, a human decides,
      # and the gate chain is untouched.
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER_HOST: ${LLM_PROVIDER_HOST:-llm-standin}
      LLM_PROVIDER_PORT: ${LLM_PROVIDER_PORT:-8443}
      LLM_MODEL: ${LLM_MODEL:-stand-in}
      LLM_PROXY_URL: ${LLM_PROXY_URL:-http://172.30.22.60:3128}
      # Retention (phase 8). Deleting evidence is irreversible, so the flag
      # defaults false and the purge endpoint is dry-run unless asked otherwise.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-false}
      RETENTION_EVIDENCE_BLOB_DAYS: ${RETENTION_EVIDENCE_BLOB_DAYS:-90}
      RETENTION_BATCH_LIMIT: ${RETENTION_BATCH_LIMIT:-200}
      # API rate limiting: availability protection, on by default.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      RATE_LIMIT_WRITE_PER_MINUTE: ${RATE_LIMIT_WRITE_PER_MINUTE:-60}
      # No egress of its own: outbound exists only via the proxy (phase 5).
      HTTPS_PROXY: "http://172.30.22.60:3128"
      HTTP_PROXY: "http://172.30.22.60:3128"
      # Internal hops must NOT go through the egress proxy (it would refuse
      # them, correctly). Only outbound traffic to the configured provider is
      # proxied. urllib/requests honour no_proxy as exact hosts, not CIDRs.
      NO_PROXY: "localhost,127.0.0.1,172.30.20.20,172.30.21.20,172.30.21.40,172.30.21.50,postgres,redis,api,frontend"
      no_proxy: "localhost,127.0.0.1,172.30.20.20,172.30.21.20,172.30.21.40,172.30.21.50,postgres,redis,api,frontend"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import http.client,sys; c=http.client.HTTPConnection('172.30.20.20',8000,timeout=3); c.request('GET','/api/v1/system/health'); sys.exit(0 if c.getresponse().status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      vapt_edge:
        ipv4_address: 172.30.20.20
      vapt_core:
        ipv4_address: 172.30.21.20
      vapt_egress:
        ipv4_address: 172.30.22.20

  worker:
    # REAL Celery worker (MVP phase 3). Dual-homed vapt_core + vapt_lab: it is
    # the ONLY component that can reach the target, and therefore the
    # authoritative evaluator of gate 8 (resolve-once-and-pin).
    # It holds NO LLM credentials and NO proxy variables: airgapped from the
    # internet directly and indirectly (NET-G1..G7).
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vapt-api:dev
    container_name: vapt_worker
    hostname: worker
    restart: "no"
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    command: ["celery", "-A", "app.worker.celery_app.celery", "worker",
              "--loglevel=INFO", "--concurrency=1", "-Q", "vapt"]
    volumes:
      - vapt_evidence:/var/lib/vapt/evidence
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      EVIDENCE_BLOB_ROOT: /var/lib/vapt/evidence
      REDACTION_HMAC_KEY: ${REDACTION_HMAC_KEY:?REDACTION_HMAC_KEY must be set}
      REDACTION_KEY_ID: ${REDACTION_KEY_ID:-v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vapt}:${POSTGRES_PASSWORD:?}@172.30.21.40:5432/${POSTGRES_DB:-vapt}
      REDIS_URL: redis://172.30.21.50:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      SCANNER_EXECUTION_ENABLED: ${SCANNER_EXECUTION_ENABLED:-false}
      ZAP_ADAPTER_ENABLED: ${ZAP_ADAPTER_ENABLED:-false}
      ACTIVE_SCAN_ENABLED: ${ACTIVE_SCAN_ENABLED:-false}
      DUAL_CONTROL_AVAILABLE: ${DUAL_CONTROL_AVAILABLE:-false}
      DEFAULT_SCANNER_ADAPTER: ${DEFAULT_SCANNER_ADAPTER:-mock}
      LAB_SUBNET: ${LAB_SUBNET:-172.30.10.0/24}
      # Hard false, not configurable: the worker is on no egress network and
      # never calls the agent. NET-C fails the whole check if this is true.
      LLM_ENABLED: "false"
      # The scheduled purge runs here. The beat schedule only exists while the
      # flag is true, and the task re-checks it before touching anything.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-false}
      RETENTION_EVIDENCE_BLOB_DAYS: ${RETENTION_EVIDENCE_BLOB_DAYS:-90}
      RETENTION_BATCH_LIMIT: ${RETENTION_BATCH_LIMIT:-200}
      RETENTION_SCHEDULE_MINUTES: ${RETENTION_SCHEDULE_MINUTES:-1440}
      ZAP_BASE_URL: ${ZAP_BASE_URL:-http://172.30.10.10:8080}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
      CANCELLATION_SLA_SECONDS: ${CANCELLATION_SLA_SECONDS:-120}
      # Fault injection for the mock adapter, used by the phase-4 tests to
      # exercise the failure paths (unconfirmed cancel, unconfirmed teardown).
      # Empty in normal operation.
      MOCK_FAULT: ${MOCK_FAULT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      vapt_core:
        ipv4_address: 172.30.21.30
      vapt_lab:
        ipv4_address: 172.30.10.30

  postgres:
    # REAL service (MVP phase 1) — digest-pinned. vapt_core only: no egress path.
    image: postgres@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    container_name: vapt_postgres
    hostname: postgres
    restart: "no"
    init: true
    user: "70:70"                      # postgres uid/gid in the alpine image
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vapt}
      POSTGRES_USER: ${POSTGRES_USER:-vapt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - listen_addresses=172.30.21.40   # core interface only, never 0.0.0.0
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    volumes:
      - vapt_pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,nosuid,size=64m
      - /run/postgresql:rw,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 172.30.21.40 -U ${POSTGRES_USER:-vapt} -d ${POSTGRES_DB:-vapt}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      vapt_core:
        ipv4_address: 172.30.21.40

  redis:
    # REAL service (MVP phase 1) — digest-pinned. vapt_core only: no egress path.
    image: redis@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
    container_name: vapt_redis
    hostname: redis
    restart: "no"
    init: true
    user: "999:1000"                   # redis uid/gid in the alpine image
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    command:
      - redis-server
      - --bind
      - 172.30.21.50                   # core interface only, never 0.0.0.0
      - --port
      - "6379"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    tmpfs:
      - /data:rw,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 172.30.21.50 -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    networks:
      vapt_core:
        ipv4_address: 172.30.21.50

  egress-proxy:
    <<: *placeholder
    container_name: vapt_egress_proxy
    hostname: egress-proxy
    command: ["python3", "/app/proxy.py"]
    volumes:
      - ./lab/egress-proxy/proxy.py:/app/proxy.py:ro
    environment:
      SERVICE_NAME: egress-proxy
      PROXY_BIND_IP: "172.30.22.60"          # egress interface only, never 0.0.0.0
      PROXY_PORT: "3128"
      EGRESS_ALLOWLIST: "${EGRESS_ALLOWLIST:-llm-standin:8443}"
      # Defence in depth: only the api's egress address may use the proxy. The
      # worker and frontend already cannot reach this port (NET-G3 / NET-I3);
      # the proxy refuses them regardless of network state.
      ALLOWED_CLIENT_CIDRS: "${ALLOWED_CLIENT_CIDRS:-172.30.22.20/32}"
      PROXY_MAX_CONCURRENT_TUNNELS: "${PROXY_MAX_CONCURRENT_TUNNELS:-16}"
      PROXY_MAX_TUNNEL_SECONDS: "${PROXY_MAX_TUNNEL_SECONDS:-900}"
      PROXY_MAX_TUNNEL_BYTES: "${PROXY_MAX_TUNNEL_BYTES:-67108864}"
      INTERNAL_DENY_CIDRS: "172.30.20.0/24,172.30.21.0/24,172.30.22.0/24,172.30.10.0/24"
    networks:
      vapt_egress:
        ipv4_address: 172.30.22.60
      vapt_wan:
        ipv4_address: 172.30.23.60

  llm-standin:
    <<: *placeholder
    container_name: vapt_llm_standin
    hostname: llm-standin
    # TEST ONLY. Stands in for the provider endpoint so no real provider is ever
    # contacted. Removed with the rest of the M1.5 stack (make net-down).
    command: ["python3", "/app/standin.py"]
    volumes:
      - ./lab/llm-standin/standin.py:/app/standin.py:ro
    environment:
      SERVICE_NAME: llm-standin
      STANDIN_PORT: "8443"
    networks:
      vapt_wan:
        ipv4_address: 172.30.23.70

volumes:
  vapt_pgdata:
    name: vapt_pgdata
  vapt_evidence:
    name: vapt_evidence
